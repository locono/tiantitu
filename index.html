  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{
    font-family:"PingFang SC","Microsoft YaHei","Segoe UI",system-ui,sans-serif;
    background:
      radial-gradient(1100px 420px at 85% -120px, #e3d9ff 0%, transparent 58%),

    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:1080px;margin:0 auto;padding:0 20px}

  /* ---------- header ---------- */
  header{
    position:sticky;top:0;z-index:50;
    background:rgba(255,255,255,.85);

    border-bottom:1px solid var(--line);
  }
  .head-in{display:flex;align-items:center;gap:16px;height:68px}
  .logo{display:flex;align-items:center;gap:11px;text-decoration:none;color:var(--ink);flex:none}
  .logo .mark{
    width:40px;height:40px;border-radius:12px;flex:none;
    background:linear-gradient(135deg,#8b5cf6,#ec4899 45%,#f59e0b 80%,#10b981);
    box-shadow:0 4px 14px rgba(139,92,246,.35);
    display:flex;align-items:flex-end;justify-content:center;gap:3px;
    padding:0 8px 8px;
  }
  .logo .mark i{display:block;border-radius:2.5px 2.5px 0 0;background:rgba(255,255,255,.95)}
  .logo .mark i:nth-child(1){width:6px;height:10px}
  .logo .mark i:nth-child(2){width:6px;height:17px}
  .logo .mark i:nth-child(3){width:6px;height:24px}
  .logo .txt{display:flex;flex-direction:column;line-height:1.15}
  .logo .txt b{
    font-size:21px;font-weight:900;letter-spacing:1px;
    background:linear-gradient(90deg,#7c3aed,#ec4899 55%,#f97316);
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .logo .txt span{font-size:10.5px;color:var(--ink-3);letter-spacing:.6px;font-weight:600}
  .head-meta{margin-left:auto;font-size:12px;color:var(--ink-3);white-space:nowrap}
  .head-meta b{color:var(--ink-2);font-weight:600}

  /* ---------- tabs ---------- */
  .tabs{display:flex;gap:8px;padding:10px 0 14px;flex-wrap:wrap}
  .tab{
    display:flex;align-items:center;gap:8px;
    padding:10px 16px;border-radius:12px;cursor:pointer;
    font-size:14.5px;font-weight:600;color:var(--ink-2);
    background:var(--card);border:1.5px solid var(--line);
    transition:all .18s ease;user-select:none;
    --tc:var(--accent);
  }
  .tab .ico{font-size:17px;line-height:1}
  .tab:hover{border-color:color-mix(in srgb,var(--tc) 45%,white);transform:translateY(-1px)}
  .tab.on{
    background:linear-gradient(135deg,var(--tc),color-mix(in srgb,var(--tc) 70%,#ec4899));
    color:#fff;border-color:transparent;
    box-shadow:0 4px 14px color-mix(in srgb,var(--tc) 45%,transparent);
  }
  .tab.on .ico{filter:drop-shadow(0 1px 3px rgba(0,0,0,.25))}

  /* ---------- search ---------- */
  .searchbar{display:flex;gap:10px;align-items:center;margin:2px 0 16px}
  .searchbox{
    flex:1;display:flex;align-items:center;gap:10px;
    background:var(--card);border:1.5px solid var(--line);border-radius:12px;
    padding:0 14px;height:46px;transition:border .18s;
  }
  .searchbox:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  .searchbox svg{flex:none;opacity:.45}
  .searchbox input{
    flex:1;border:0;outline:0;background:transparent;
    font-size:15px;color:var(--ink);height:100%;
  }
  .searchbox input::placeholder{color:var(--ink-3)}
  .searchbox .clear{
    display:none;cursor:pointer;color:var(--ink-3);font-size:16px;
    width:22px;height:22px;border-radius:50%;background:var(--line);
    line-height:20px;text-align:center;flex:none;
  }
  .searchbox .clear:hover{color:var(--ink)}
  .searchbox.hasval .clear{display:block}
  .count{
    font-size:12.5px;color:var(--ink-3);white-space:nowrap;min-width:74px;text-align:right;
  }
  .count b{color:var(--accent);font-size:14px}

  /* ---------- section head ---------- */
  .sec-head{display:flex;align-items:baseline;gap:12px;margin:6px 0 14px;flex-wrap:wrap}
  .sec-head h2{font-size:21px;font-weight:900;letter-spacing:.5px}
  .sec-head .sub{font-size:12.5px;color:var(--ink-3)}

  /* ---------- legend ---------- */
  .legend{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:16px;font-size:12px;color:var(--ink-2)}
  .legend .li{display:flex;align-items:center;gap:6px}
  .legend .sw{width:10px;height:10px;border-radius:3px}

  /* ---------- ladder ---------- */
  .ladder{display:flex;flex-direction:column;gap:8px;padding-bottom:8px}
  .row{
    display:grid;
    grid-template-columns:44px 52px minmax(150px,220px) 1fr 64px;
    align-items:center;gap:12px;
    background:var(--card);border:1px solid var(--line);border-radius:12px;
    padding:9px 14px 9px 10px;
    transition:box-shadow .15s, transform .15s, border-color .15s;
    animation:rise .3s ease both;
  }
  @keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .row:hover{box-shadow:var(--shadow);border-color:#cfd9ee;transform:translateX(2px)}
  .rank{font-weight:800;font-size:15px;color:var(--ink-3);text-align:center}
  .row:nth-child(1) .rank,.row:nth-child(2) .rank,.row:nth-child(3) .rank{color:var(--accent);font-size:16px}
  .tier{
    text-align:center;font-weight:800;font-size:12.5px;
    padding:4px 0;border-radius:8px;letter-spacing:.5px;
  }
  .t-S{background:var(--t-s-bg);color:var(--t-s)}
  .t-A{background:var(--t-a-bg);color:var(--t-a)}
  .t-B{background:var(--t-b-bg);color:var(--t-b)}
  .t-C{background:var(--t-c-bg);color:var(--t-c)}
  .t-D{background:var(--t-d-bg);color:var(--t-d)}

  .name .nm mark{background:#ffe9a8;padding:0 1px;border-radius:3px}
  .name .meta{font-size:11.5px;color:var(--ink-3);margin-top:2px;display:flex;gap:8px;align-items:center}
  .bdot{width:8px;height:8px;border-radius:50%;flex:none;display:inline-block}
  .barwrap{position:relative;height:22px;border-radius:7px;background:#eef1f7;overflow:hidden}
  .bar{
    position:absolute;inset:0 auto 0 0;border-radius:7px;
    min-width:6px;
    transition:width .5s cubic-bezier(.22,.8,.3,1);
  }
  .bar::after{
    content:"";position:absolute;inset:0;
    background:linear-gradient(90deg,rgba(255,255,255,.28),transparent 55%);
  }
  .score{font-weight:800;font-size:15px;text-align:right;font-variant-numeric:tabular-nums}

  .empty{
    text-align:center;color:var(--ink-3);padding:60px 0;font-size:14px;
    background:var(--card);border:1px dashed var(--line);border-radius:14px;
  }

  footer{border-top:1px solid var(--line);margin-top:28px;padding:22px 0 40px}
  .foot-in{display:flex;gap:14px;flex-wrap:wrap;align-items:center;justify-content:space-between}

    .tab{padding:8px 12px;font-size:13px}
    .logo{font-size:16px}
  }

/* ============ 渲染 ============ */
const tabsEl = document.getElementById("tabs");
const ladderEl = document.getElementById("ladder");
const searchEl = document.getElementById("search");
const sboxEl = document.getElementById("sbox");
const countEl = document.getElementById("count");
const secTitle = document.getElementById("secTitle");
const secSub = document.getElementById("secSub");
const legendEl = document.getElementById("legend");
const clearEl = document.getElementById("sclear");
let cur = DATA[0].id;
let query = "";

/* tabs */
DATA.forEach(d=>{
  const t=document.createElement("div");
  t.className="tab";t.dataset.id=d.id;
  t.style.setProperty("--tc",d.c);
  t.innerHTML=`<span class="ico">${d.icon}</span>${d.name.replace(" 天梯图","")}`;
  t.onclick=()=>switchTab(d.id);
  tabsEl.appendChild(t);
});

/* legend */
legendEl.innerHTML = [["S","旗舰","t-S"],["A","高端","t-A"],["B","主流","t-B"],["C","中端","t-C"],["D","入门","t-D"]]
  .map(([k,l,c])=>`<span class="li"><span class="sw ${c}"></span>${k} · ${l}</span>`).join("")
  + `<span class="li" style="margin-left:auto;color:var(--ink-3)">● 品牌色见条目左侧圆点</span>`;

function esc(s){return s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function hl(name,q){
  if(!q) return esc(name);
  const i=name.toLowerCase().indexOf(q);
  if(i<0) return esc(name);
  return esc(name.slice(0,i))+"<mark>"+esc(name.slice(i,i+q.length))+"</mark>"+esc(name.slice(i+q.length));
}

function render(){
  const d=DATA.find(x=>x.id===cur);
  secTitle.innerHTML=`<span style="background:linear-gradient(90deg,${d.c},color-mix(in srgb,${d.c} 55%,#ec4899));-webkit-background-clip:text;background-clip:text;color:transparent">${d.icon} ${esc(d.name)}</span>`;
  secSub.textContent=d.sub;
  d.items.sort((a,b)=>b.s-a.s);
  const q=query.trim().toLowerCase();
  sboxEl.classList.toggle("hasval",!!q);
  let shown=0;
  const maxScore=Math.max(...d.items.map(i=>i.s));
  const frag=[];
  d.items.forEach((it,idx)=>{
    const hay=(it.n+" "+it.b+" "+(it.a||"")).toLowerCase();
    if(q && !hay.includes(q)) return;
    shown++;
    const [tk,tl]=tierOf(it.s);
    const tc=TIER_COLORS[tk];
    const brandColor=BRAND[it.b]||BRAND["其他"];
    frag.push(`
      <div class="row" style="animation-delay:${Math.min(idx*22,400)}ms">
        <div class="rank">${idx+1}</div>
        <div class="tier t-${tk}" title="${tk} 档 · ${tl}">${tk}</div>
        <div class="name">
          <div class="nm">${hl(it.n,q)}</div>
          <div class="meta">
            <span class="bdot" style="background:${brandColor}"></span>
            <span>${esc(it.b)}</span><span>${it.y} 年</span><span>${tl}</span>
          </div>
        </div>
        <div class="barwrap"><div class="bar" style="width:0%;background:linear-gradient(90deg,color-mix(in srgb,${tc} 62%,white),${tc})" data-w="${(it.s/maxScore*100).toFixed(1)}" title="${tk} 档 · ${tl}"></div></div>
        <div class="score" style="color:${tc}">${it.s}</div>
      </div>`);
  });
  ladderEl.innerHTML = shown? frag.join("") : `<div class="empty">没有找到与「${esc(query)}」匹配的硬件 😢<br><span style="font-size:12px">试试更短的关键词，如 5090 / 锐龙 / 天玑 / M4</span></div>`;
  countEl.innerHTML = q? `匹配 <b>${shown}</b> / ${d.items.length} 项` : `共 <b>${d.items.length}</b> 项`;
  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    ladderEl.querySelectorAll(".bar").forEach(b=>b.style.width=b.dataset.w+"%");
  }));
}

function switchTab(id){
  if(cur===id) {render();return;}
  cur=id;
  tabsEl.querySelectorAll(".tab").forEach(t=>t.classList.toggle("on",t.dataset.id===id));
  render();
}

searchEl.addEventListener("input",()=>{query=searchEl.value;render()});
clearEl.onclick=()=>{searchEl.value="";query="";render();searchEl.focus()};
document.addEventListener("keydown",e=>{
  if(e.key==="/" && document.activeElement!==searchEl){e.preventDefault();searchEl.focus()}
  if(e.key==="Escape" && document.activeElement===searchEl){searchEl.value="";query="";render();searchEl.blur()}
});

switchTab("soc");
</script>
